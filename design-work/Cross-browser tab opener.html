document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"cabc2e2d-a6b9-41db-8bc6-c827a31087fe\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n\n<style>\n  @keyframes toastIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }\n  * { box-sizing:border-box; }\n  .rowA .setdefA { opacity:0; transform:translateX(5px); transition:opacity .14s, transform .14s; }\n  .rowA:hover .setdefA { opacity:1; transform:none; }\n  .rowA:hover { background:#f6f6f9; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"--ac:{{ accent }};min-height:100%;padding:52px 40px 80px;background:#e8e8ec;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui;color:#1d1d1f\">\n  <div style=\"max-width:1380px;margin:0 auto\">\n\n    <header style=\"margin-bottom:40px;max-width:760px\">\n      <div style=\"font-size:12px;font-weight:600;letter-spacing:.08em;color:#86868b;margin-bottom:10px\">OPEN URL IN BROWSER · POPUP REDESIGN<\u002Fdiv>\n      <h1 style=\"font-size:30px;font-weight:680;letter-spacing:-.02em;margin:0 0 12px\">Popup redesign — setting the default browser<\u002Fh1>\n      <p style=\"font-size:14.5px;line-height:1.55;color:#515154;margin:0\">Building on the one-tap launcher you liked: the default browser is the hero with all three actions as buttons, and holding ⌥ momentarily opens in the focused window instead of a new one. The open question is the awkward per-browser radio dot — below are four different ways to <strong>promote a browser to the hero<\u002Fstrong>, all live.<\u002Fp>\n    <\u002Fheader>\n\n    <!-- ============ ROUND 5 · 4b + SETTINGS TOGGLE ============ -->\n    <section id=\"5\" style=\"margin-bottom:52px\">\n      <div style=\"max-width:760px;margin-bottom:22px\">\n        <h2 style=\"font-size:20px;font-weight:680;letter-spacing:-.015em;margin:0 0 8px\">Round 5 · 4b, with a settings toggle for button style<\u002Fh2>\n        <p style=\"font-size:13.5px;line-height:1.55;color:#515154;margin:0\">Your favorite (4b — pick default from the hero), now with a real settings page behind the gear. In settings, switch the per-browser action buttons between full <strong>labels<\u002Fstrong> (Current tab · Selected · All 11) and the <strong>compact<\u002Fstrong> C / S / A from 4d. Tap the gear to try it — the choice applies live to every browser.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap\">\n\n        <div id=\"5a\" style=\"width:372px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-size:13px;font-weight:700;color:#fff;background:var(--ac);padding:3px 9px;border-radius:7px\">5a<\u002Fspan><strong style=\"font-size:15px;font-weight:650\">4b + settings · button style toggle<\u002Fstrong><\u002Fdiv>\n          <div style=\"background:#fff;border-radius:15px;box-shadow:0 14px 44px rgba(0,0,0,.16);border:1px solid rgba(0,0,0,.07);overflow:hidden\">\n\n            <!-- header -->\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:11px 12px 11px 14px\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <sc-if value=\"{{ iInSettings }}\" hint-placeholder-val=\"{{ false }}\"><div onclick=\"{{ iBack }}\" title=\"Back\" style=\"width:26px;height:26px;margin-left:-4px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93;font-size:17px\" style-hover=\"background:#ececef;color:#515154\">‹<\u002Fdiv><\u002Fsc-if>\n                <span style=\"font-size:13.5px;font-weight:650\">{{ iTitle }}<\u002Fspan>\n              <\u002Fdiv>\n              <div onclick=\"{{ iToggleView }}\" title=\"Settings\" style=\"{{ iGearStyle }}\"><svg width=\"16\" height=\"16\" viewBox=\" icker }}\" style=\"display:flex;align-items:center;gap:11px;margin-bottom:12px;cursor:pointer\">\n                  <dc-import name=\"BrowserIcon\" kind=\"{{ iHero.kind }}\" mono=\"{{ iHero.mono }}\" color=\"{{ iHero.color }}\" size=\"{{ 34 }}\" hint-size=\"34px,34px\"><\u002Fdc-import>\n                  <div style=\"flex:1;min-width:0\"><div style=\"display:flex;align-items:center;gap:6px\"><span style=\"font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ iHero.name }}<\u002Fspan><\u002Fdiv><div style=\"font-size:11px;color:#86868b;margin-top:1px\">Tap to change default browser<\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-size:11px;color:#86868b\">▾<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ iOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"position:absolute;left:12px;right:12px;top:56px;z-index:8;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:11px;box-shadow:0 14px 34px rgba(0,0,0,.2);padding:4px\">\n                    <div style=\"font-size:9.5px;font-weight:600;color:#8e8e93;letter-spacing:.05em;padding:6px 9px 4px\">SET DEFAULT TO<\u002Fdiv>\n                    <sc-for list=\"{{ iPicks }}\" as=\"p\" hint-placeholder-count=\"6\"><div onclick=\"{{ p.onPick }}\" style=\"display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer\" style-hover=\"background:#f2f2f5\"><dc-import name=\"BrowserIcon\" kind=\"{{ p.kind }}\" mono=\"{{ p.mono }}\" color=\"{{ p.color }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fdc-import><span style=\"flex:1;font-size:12.5px;font-weight:500\">{{ p.name }}<\u002Fspan><sc-if value=\"{{ p.isDefault }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:8px;height:8px;border-radius:50%;background:var(--ac)\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <!-- hero action buttons -->\n =\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fdc-import><span style=\"flex:1;min-width:0;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ b.name }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:5px\"><sc-for list=\"{{ b.actions }}\" as=\"act\" hint-placeholder-count=\"3\"><button onclick=\"{{ act.onClick }}\" style=\"padding:6px 4px;border:1px solid rgba(0,0,0,.12);border-radius:8px;background:#fff;color:#3a3a3c;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap\" style-hover=\"background:#f2f2f5\">{{ act.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ iCompact }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;align-items:center;gap:9px\"><dc-import name=\"BrowserIcon\" kind=\"{{ b.kind }}\" mono=\"{{ b.mono }}\" color=\"{{ b.color }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fdc-import><span style=\"flex:1;min-width:0;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ b.name }}<\u002Fspan><sc-for list=\"{{ b.actions }}\" as=\"act\" hint-placeholder-count=\"3\"><button onclick=\"{{ act.onClick }}\" title=\"{{ act.label }}\" style=\"width:26px;height:26px;border:1px solid rgba(0,0,0,.12);border-radius:7px;background:#fff;color:#6e6e73;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;flex:0 0 auto\" style-hover=\"background:#ececef\">{{ act.short }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"border-top:1px solid rgba(0,0,0,.07);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;background:#fafafb\"><div onclick=\"{{ iToggleClose }}\" style=\"display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none\"><div style=\"{{ iBox }}\"><sc-if value=\"{{ iClose }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin-top:-1px\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><span style=\"font-size:12px;color:#3a3a3c\">Close source tabs<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:5px;font-size:11px;color:#86868b\">Hold <span style=\"font-weight:600;color:#515154;border:1px solid rgba(0,0,0,.16);border-radius:5px;padding:0 5px;line-height:16px\">⌥<\u002Fspan> for focused window<\u002Fdiv><\u002Fdiv>\n              <sc-if value=\"{{ iToast }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:9px 14px;background:#1d1d1f;color:#fff;font-size:11.5px;display:flex;align-items:center;gap:8px;animation:toastIn .18s ease\"><div style=\"width:6px;height:6px;border-radius:50%;background:#34c759;flex:0 0 auto\"><\u002Fdiv>{{ iToast }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fsc-if>\n\n            <!-- ===== SETTINGS VIEW ===== -->\n            <sc-if value=\"{{ iInSettings }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid rgba(0,0,0,.07);padding:16px 16px 20px\">\n\n                <div style=\"font-size:10.5px;font-weight:600;color:#8e8e93;letter-spacing:.05em;margin:0 0 9px\">ACTION BUTTONS<\u002Fdiv>\n                <div style=\"display:flex;background:#ececef;border-radius:9px;padding:3px;margin-bottom:10px\"><sc-for list=\"{{ iStyleSeg }}\" as=\"s\" hint-placeholder-count=\"2\"><div onclick=\"{{ s.onClick }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n\n                <!-- live preview of the choice -->\n                <div style=\"border:1px solid rgba(0,0,0,.08);border-radius:11px;padding:11px;background:#fafafb;margin-bottom:9px\">\n                  <div style=\"font-size:10px;font-weight:600;color:#a1a1a6;letter-spacing:.04em;margin-bottom:8px\">PREVIEW · {{ iHero.name }}<\u002Fdiv>\n                  <sc-if value=\"{{ iLabels }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px\"><sc-for list=\"{{ iHero.actions }}\" as=\"act\" hint-placeholder-count=\"3\"><div style=\"padding:9px 5px;border:1px solid color-mix(in srgb,var(--ac) 32%,transparent);border-radius:9px;background:#fff;color:var(--ac);font-size:12px;font-weight:600;text-align:center;white-space:nowrap\">{{ act.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ iCompact }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;gap:6px\"><sc-for list=\"{{ iHero.actions }}\" as=\"act\" hint-placeholder-count=\"3\"><div style=\"width:38px;height:36px;border:1px solid color-mix(in srgb,var(--ac) 32%,transparent);border-radius:9px;background:#fff;color:var(--ac);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto\">{{ act.short }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <p style=\"font-size:11.5px;line-height:1.5;color:#86868b;margin:0 2px 20px\">{{ iStyleHint }}<\u002Fp>\n\n                <div style=\"font-size:10.5px;font-weight:600;color:#8e8e93;letter-spacing:.05em;margin:0 0 9px\">TABS<\u002Fdiv>\n                <div onclick=\"{{ iToggleClose }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:2px 0\"><div style=\"{{ iBox }}\"><sc-if value=\"{{ iClose }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin-top:-1px\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv><div><div style=\"font-size:12.5px;color:#1d1d1f;font-weight:500\">Close source tabs after opening<\u002Fdiv><div style=\"font-siz
